# Permission nodes registered at startup for permission editor discovery.
flag-edit:
  havenclaims.flag.edit.basic:
    - build
    - break
    - interact
    - container_access
    - door_access
    - switch_access
    - redstone_access
  havenclaims.flag.edit.entity:
    - entity_damage
    - crop_trample
  havenclaims.flag.edit.items:
    - item_pickup
    - item_drop
  havenclaims.flag.edit.protection:
    - piston_protection
  havenclaims.flag.edit.environment:
    - fluid_flow
    - explosion_damage
    - fire_spread
    - mob_griefing
  havenclaims.flag.edit.entity-control:
    - remove_hostile_entities
    - remove_passive_entities

commands:
  havenclaims.deny.manage: "Allows claim owners and managers to use /claim deny, /claim undeny, and /claim denied."
admin:
  havenclaims.admin.claim.create: "Allows staff to create server-owned admin claims."
  havenclaims.admin.claim.edit: "Allows staff to edit server-owned admin claims."
  havenclaims.admin.claim.delete: "Allows staff to delete server-owned admin claims."
  havenclaims.admin.claim.list: "Allows staff to list server-owned admin claims."
  havenclaims.admin.claim.teleport: "Allows staff to teleport to server-owned admin claims."
  havenclaims.admin.userclaims.view: "Allows staff to browse player claims."
  havenclaims.admin.userclaims.edit: "Allows staff to edit player claim flags and members."
  havenclaims.admin.userclaims.delete: "Allows staff to delete player claims."
  havenclaims.admin.userclaims.teleport: "Allows staff to teleport to player claims."
  havenclaims.admin.userclaims.transfer: "Allows staff to transfer player claims."
  havenclaims.admin.reload: "Allows staff to reload HavenClaims configuration when supported."
  havenclaims.admin.limit: "Allows staff to view and modify per-player claim chunk limits."
bypass:
  havenclaims.bypass.entry-deny: "Allows staff to enter claims even when listed as denied."
