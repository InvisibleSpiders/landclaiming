# General claim settings.
claiming:
  # Maximum claim name length accepted by /claims create.
  max-name-length: 32
  # Minimum chunk gap between a player claim and another player's claim.
  player-buffer-distance: 3
  # Minimum chunk gap between player claims and admin-owned claims.
  admin-buffer-distance: 3
  # Allows claim groups to become non-rectangular by adding or removing chunks.
  allow-irregular-claims: true
  # Offers merge/separate choices when new chunks touch one of the player's existing claims.
  allow-merge-with-own-claims: true

limits:
  # Enables claim limits from permissions.yml.
  use-permission-limits: true
  # Used when no configured limit permission is found.
  default-claim-limit: 10
  over-limit:
    # Allows economy payments for chunks above the player's permission limit.
    enabled: true
    # Options: flat, exponential.
    pricing-mode: exponential
    flat-cost-per-chunk: 250.0
    exponential-base-cost: 250.0
    exponential-multiplier: 1.25

ui:
  # Prefer Paper Dialog API menus where the current server supports them.
  prefer-dialogs: true
  # Use inventory menus for dense or item-based flows.
  use-inventory-fallbacks: true

visuals:
  border:
    # Uses temporary glowing BlockDisplay entities for player-visible chunk outlines.
    enabled: true
    # How long temporary chunk borders remain visible.
    duration-ticks: 160
    # Thickness of each display-entity line segment.
    thickness: 0.08
    # Display entity view range in blocks.
    view-range: 96.0

shortcuts:
  sneak-swap-hand:
    # Opens the context claim menu when the player sneaks and presses the swap-hand key.
    enabled: true
    require-claim-tool-in-hand: false
    cancel-item-swap: true

selection:
  # Clears a pending selection when the player switches away from the claim tool.
  clear-on-tool-switch: true
  double-crouch-clear:
    # Clears a pending selection when the player crouches twice within the configured window.
    enabled: true
    # 80 ticks is about 4 seconds at normal server speed.
    window-ticks: 80
